# 목적: iksan.store 도메인의 Nginx 리버스 프록시·SSL 설정
# 왜: iwinv 4서버(Nginx/FE/BE/DB) 분리 구조에 맞춰, FE/BE 각 서버의 사설 IP로 경로 기반 라우팅
# 무엇: 80은 443으로 리다이렉트, 443은 인증서 적용 후 /api는 BE, 나머지는 FE로 프록시

server {
    listen 80;
    server_name iksan.store www.iksan.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iksan.store www.iksan.store;

    ssl_certificate /etc/letsencrypt/live/iksan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iksan.store/privkey.pem;

    # BE 사설 서버(10.101.2.179:4000)로 API 요청 프록시
    # proxy_pass에 경로를 안 붙여야 /api/products 등 원래 경로가 그대로 BE로 전달됨
    location /api/ {
        proxy_pass http://10.101.2.179:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FE 사설 서버(10.101.2.77:3000)로 나머지 요청 프록시
    location / {
        proxy_pass http://10.101.2.77:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 목적: Private Docker Registry(registry.iksan.store)를 위한 리버스 프록시·SSL 설정
# 왜: Docker 클라이언트는 HTTPS가 아닌 레지스트리는 거부하므로, Nginx가 SSL 종료 후
#     Nginx 서버 안에서 로컬로 떠있는 registry 컨테이너(host.docker.internal:5000)로 프록시
# 무엇: nginx 프로세스는 자체 컨테이너 안에서 실행되므로 127.0.0.1은 자기 자신을 가리킴 —
#      호스트(=registry 컨테이너가 떠있는 곳)에 도달하려면 host.docker.internal을 써야 함
#      (docker-compose.yml의 extra_hosts: host.docker.internal:host-gateway 설정과 짝을 이룸)
server {
    listen 443 ssl;
    server_name registry.iksan.store;

    ssl_certificate /etc/letsencrypt/live/registry.iksan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.iksan.store/privkey.pem;

    client_max_body_size 0;

    location /v2/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 900;
    }
}
