name: Deploy BE

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Private Registry 로그인
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.iksan.store -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: 이미지 빌드 및 푸시
        run: |
          docker build -t registry.iksan.store/wku-iksan-store-be:latest .
          docker push registry.iksan.store/wku-iksan-store-be:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale 연결
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: BE 서버에 SSH 접속해 재배포 (Tailscale 직접 연결)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BE_HOST }}
          username: ${{ secrets.BE_USER }}
          key: ${{ secrets.CICD_SSH_KEY }}
          script: |
            cd ~/wku-iksan-store-BE
            ./deploy.sh
